function vSheet(){
  if(!ui.sheet)return '';
  var inner=ui.sheet==='queue'?sQueue():sClient(ui.sheet);
  if(!inner)return '';
  return '<div class="overlay" role="dialog" aria-modal="true"><div class="sheet">'+inner+'</div></div>';
}
function sClient(id){
  var c=clientById(id);if(!c)return '';
  var e=enrich(c),el=eligibility(e,false),pm=pending(c),stage=pm?pm.stage:(el.ok?el.stage:null),body='';
  if(stage){
    var noTel=!c.tel;
    body='<p class="lbl">Relance '+stage+' sur 3'+(el.channel?' · canal conseillé : '+CH_LABEL[el.channel]:'')+'</p><textarea class="ta" id="draft" data-bind="draft" style="margin-top:6px">'+esc(ui.draftMsg)+'</textarea>'+
    '<div class="acts"><button class="btn btn-primary" data-act="send" data-ch="whatsapp"'+(noTel?' disabled':'')+'>WhatsApp</button><button class="btn" data-act="send" data-ch="sms"'+(noTel?' disabled':'')+'>SMS</button>'+
    (c.email?'<button class="btn" data-act="send" data-ch="email">Email</button>':'')+'<button class="btn" data-act="copy">Copier le message</button>'+
    '<button class="btn-link full" data-act="send" data-ch="simulation">Marquer comme envoyé (simulation)</button></div>'+
    '<p class="hint" style="margin-top:10px">Envoi en un tap : WhatsApp, SMS ou email s’ouvre avec le message prêt. Avec les relances automatiques, D4U le fait pour toi'+(realSend()?'.':' (en simulation pour l’instant).')+'</p>';
  } else {
    var why=el.reason==='exclu'?(el.why==='optout'?'Ce client est désabonné : il ne recevra plus de relance.':el.why==='contact'?'Aucun téléphone ni email exploitable : impossible de le relancer.':'Aucune date de visite : données insuffisantes.'):
      el.reason==='actif'?'Client actif : aucune relance nécessaire.':el.reason==='booked'?'Ce client a déjà un rendez-vous prévu.':
      el.reason==='wait'?'Prochaine relance (n°'+el.stage+') dans '+el.inDays+' jour'+(el.inDays>1?'s':'')+'.':el.reason==='replied'?'Ce client a répondu : la séquence est en pause.':
      el.reason==='done'?'Les 3 relances ont été envoyées.':el.reason==='off'?'L’automation correspondante est désactivée.':'';
    body='<div class="note">'+why+'</div>';
  }
  var res='';
  if(c.recovered&&e.status==='actif')res='<div class="note" style="margin-top:16px;color:var(--diamond)"><span class="glyph">◇</span>&nbsp; Rendez-vous récupéré.</div>';
  else if(c.relanced&&!c.optout)res='<p class="lbl" style="margin-top:20px">Résultat</p><div class="acts"><button class="btn'+(c.replied?' btn-primary':'')+'" data-act="replied">'+(c.replied?'A répondu ✓':'A répondu')+'</button><button class="btn btn-primary" data-act="recovered">A repris rendez-vous</button></div>';
  var hist=S.messages.filter(function(m){return m.clientId===c.id&&m.status==='envoye';}).sort(function(a,b){return b.sentAt-a.sentAt;}).map(function(m){return '<div class="hist-r"><span>Relance '+m.stage+' · '+msgLabel(m)+'</span><span class="muted">'+ago(m.sentDay)+'</span></div>';}).join('');
  var rhythm=c.lastVisit?'<div class="muted" style="font-size:13px;margin-top:6px">Rythme habituel : tous les '+e.fq+' jours ('+(e.autoFq?'calculé d’après son historique':'réglage')+')<br>'+
    (e.late>0?'Retour prévu le '+fmtDate(e.due)+' · en retard de '+e.late+' jours':'Retour prévu le '+fmtDate(e.due)+' · dans '+(-e.late)+' jours')+'</div>':'';
  var unsub=c.optout?(c.optoutSource==='manual'?'<div style="margin-top:20px"><button class="btn-link" data-act="resub">Réactiver les messages pour ce client</button></div>':''):
    '<div style="margin-top:20px"><button class="btn-link" data-act="unsub">Ce client ne veut plus de messages (STOP)</button></div>';
  return '<div class="sheet-h"><div><h2>'+esc(c.prenom)+' '+esc(c.nom)+'</h2><div style="display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap">'+pill(e.status)+'<span class="muted" style="font-size:13.5px">'+(c.lastVisit?e.days+' jours · vu le '+fmtDate(c.lastVisit):'Aucune visite connue')+'</span></div>'+rhythm+'<div class="muted" style="font-size:13px;margin-top:6px">'+esc([c.tel,c.email].filter(Boolean).join(' · '))+'</div></div><button class="x" data-act="close" aria-label="Fermer">×</button></div>'+
    body+res+(hist?'<div style="margin-top:20px"><p class="lbl">Historique</p><div class="hist">'+hist+'</div></div>':'')+unsub;
}
function sQueue(){
  var q=S.messages.filter(function(m){return m.status==='a_envoyer';});
  var head='<div class="sheet-h"><div><h2>File d’envoi</h2><p class="muted" style="margin-top:6px;font-size:14px">'+(q.length?q.length+' message'+(q.length>1?'s':'')+' à envoyer':'Tout est traité.')+'</p></div><button class="x" data-act="close" aria-label="Fermer">×</button></div>';
  if(!q.length)return head+'<button class="btn btn-primary btn-block" data-act="to-results">Voir les résultats</button>';
  var rows=q.map(function(m){var c=clientById(m.clientId);if(!c)return '';
    return '<div class="q-row"><div class="q-top"><b>'+esc(c.prenom)+' '+esc(c.nom)+'</b><span class="pill p-neutral">Relance '+m.stage+'</span></div><p>'+esc(m.text)+'</p><div class="q-btns"><button class="btn btn-sm" data-act="send-q" data-id="'+m.id+'" data-ch="whatsapp"'+(c.tel?'':' disabled')+'>WhatsApp</button><button class="btn btn-sm" data-act="send-q" data-id="'+m.id+'" data-ch="sms"'+(c.tel?'':' disabled')+'>SMS</button></div></div>';}).join('');
  return head+'<div class="note" style="margin-bottom:8px">'+(realSend()?'Les relances automatiques partent toutes seules pendant les heures d’envoi. Tu peux aussi envoyer un message toi-même en un tap.':'Mode simulation : aucun envoi automatique réel. Simule l’envoi pour tester, ou envoie chaque message en un tap.')+'</div><div>'+rows+'</div>'+
    '<div style="margin-top:16px"><button class="btn btn-primary btn-block" data-act="sim-all">Simuler l’envoi des '+q.length+' messages</button></div>';
}

/* ---------- rendu ---------- */
function render(){
  document.getElementById('root').innerHTML=ui.view==='landing'?vLanding():ui.view==='auth'?vAuth():ui.view==='onboarding'?vOnboard():vApp();
  document.getElementById('sheet').innerHTML=ui.view==='app'?vSheet():'';
}
function go(view,tab){ui.view=view;if(tab)ui.tab=tab;ui.sheet=null;try{window.scrollTo(0,0);}catch(e){}render();}
function kick(){ /* mode connecté : demande au serveur de traiter tout de suite (dans les heures d'envoi) */
  if(!BACKEND||!sess)return;
  pushNow().then(runNow).then(function(){return pollServer();}).then(function(n){if(n&&ui.view==='app'&&!ui.sheet&&!isTyping())render();});
}
function isTyping(){var a=document.activeElement;return !!(a&&(a.tagName==='TEXTAREA'||a.tagName==='INPUT'||a.tagName==='SELECT'));}

/* ---------- actions ---------- */
function readProfile(prefix,keys){keys.forEach(function(k){var el=document.getElementById(prefix+k);if(el)S.profile[k]=el.value.trim();});}
function validateProfile(){
  var p=S.profile,er={};
  if(!p.nom)er.nom='Indique ton nom ou celui de ton salon.';
  var l=p.lien;
  if(!l)er.lien='Ajoute ton lien de réservation.';
  else{if(!/^https?:\/\//i.test(l))l='https://'+l;if(/\s/.test(l)||l.indexOf('.')<0)er.lien='Ce lien ne semble pas valide.';else p.lien=l;}
  var c=p.contact;
  if(!c)er.contact='Ajoute un téléphone ou un email.';
  else if(c.indexOf('@')>-1?!EMAIL_RE.test(c):digits(c).length<7)er.contact='Ce téléphone ou cet email ne semble pas valide.';
  return er;
}
function handleRows(rows,name){
  var r=startImport(rows,name);
  if(!r.ok){ui.importErr=r.error;ui.imp=null;render();return;}
  ui.imp=r.imp;ui.importErr=null;ui.step=2;try{window.scrollTo(0,0);}catch(e){}render();
}
function readFile(file){
  ui.busy=true;ui.importErr=null;render();
  readTable(file).then(function(rows){ui.busy=false;handleRows(rows,file.name);},function(err){ui.busy=false;ui.importErr=err&&err.title?err:{title:'Lecture impossible',msg:'Le fichier n’a pas pu être lu.'};render();});
}
function afterImport(){
  if(S.auto.on){var n=runEngine();if(n)toast(n+' relance'+(n>1?'s':'')+' préparée'+(n>1?'s':'')+SIM()+'.');}
  ui.step=(S.onboarded&&profileComplete())?4:3;ui.errors={};try{window.scrollTo(0,0);}catch(e){}render();
}
function doSend(ch,msgId,cid){
  var m,c;
  if(msgId){m=S.messages.filter(function(x){return x.id===msgId;})[0];c=m&&clientById(m.clientId);}
  else{
    c=clientById(cid);if(!c)return;var e=enrich(c),el=eligibility(e,false),pm=pending(c),text=(ui.draftMsg||'').trim();
    if(!text){toast('Le message est vide.');return;}
    if(pm){m=pm;m.text=text;}else{if(!el.ok)return;m=queueMsg(c,el.stage,text,{channel:ch==='simulation'?el.channel:ch,type:el.type});}
  }
  if(!m||!c)return;
  if(ch==='simulation'){markSent(m,'simulation',true);toast('Envoi simulé. Rien n’est parti réellement.');}
  else{markSent(m,ch,false);var ok=openExternal(linkFor(ch,c,m.text));if(ok)toast('Relance marquée comme envoyée.');else{copyText(m.text);toast('Message copié : colle-le dans '+CH_LABEL[ch]+'.');}}
  ui.draftMsg='';render();
}
var saveT;function saveSoon(){clearTimeout(saveT);saveT=setTimeout(save,250);}
function updPrev(i){var el=document.getElementById('prev'+i);if(el){var ex=exampleClient();el.textContent=renderTpl(S.templates[i],ex.c,ex.days);}}
function setMaster(){
  if(!S.auto.on){
    if(!S.auto.consent){toast('Coche d’abord la confirmation d’accord des clients.');return;}
    S.auto.on=true;var n=runEngine();save();render();kick();toast(n?n+' relance'+(n>1?'s':'')+' préparée'+(n>1?'s':'')+SIM()+'.':'Relances automatiques activées'+SIM()+'.');
  } else {S.auto.on=false;save();render();toast('Relances automatiques désactivées.');}
}

document.addEventListener('click',function(ev){
  var t=ev.target;
  if(t.classList&&t.classList.contains('overlay')){ui.sheet=null;render();return;}
  var a=t.closest&&t.closest('[data-act]');if(!a)return;
  var act=a.getAttribute('data-act'),id=a.getAttribute('data-id'),v=a.getAttribute('data-v'),ch=a.getAttribute('data-ch');
  if(a.disabled)return;
  switch(act){
    case 'home':go('landing');break;
    case 'open-app':case 'start':if(BACKEND&&!sess){ui.authMsg='';go('auth');break;}enter();break;
    case 'auth-in':case 'auth-up':
      var em=((document.getElementById('a-email')||{}).value||'').trim(),pw=(document.getElementById('a-pass')||{}).value||'';
      if(!em||!pw){ui.authEmail=em;ui.authMsg='Entre ton email et ton mot de passe.';render();break;}
      if(act==='auth-up'&&pw.length<8){ui.authEmail=em;ui.authMsg='Mot de passe trop court (8 caractères minimum).';render();break;}
      ui.authBusy=true;ui.authMsg='';ui.authEmail=em;render();
      authCall(act==='auth-up'?'signup':'signin',em,pw).then(function(j){
        if(!j.access_token){ui.authBusy=false;ui.authMsg='Compte créé. Vérifie ta boîte mail pour confirmer, puis connecte-toi.';render();return null;}
        storeSess(sessFrom(j));return bootRemote().then(function(){ui.authBusy=false;fetchStatus();enter();});
      }).catch(function(e){ui.authBusy=false;ui.authMsg=e&&e.message||'Connexion impossible.';render();});
      break;
    case 'signout':pushNow().then(function(){signOut();ui.filter='recover';go('landing');});break;
    case 'freq':if(ui.view==='onboarding')readProfile('f-',['nom','lien','contact']);S.profile.freq=+v;save();if(ui.view==='app')toast('Fréquence mise à jour.');render();break;
    case 'tog':
      if(v==='adapt'){if(ui.view==='onboarding')readProfile('f-',['nom','lien','contact']);S.profile.adapt=!S.profile.adapt;}
      else S.auto[v]=!S.auto[v];
      save();render();break;
    case 'master':setMaster();break;
    case 'goto-auto':go('app','auto');break;
    case 'paste-import':var pv=document.getElementById('f-paste');if(!pv||!pv.value.trim()){ui.importErr={title:'Rien à analyser',msg:'Colle d’abord ton tableau, ou choisis un fichier.'};render();}else handleRows(parseCSV(pv.value),'Tableau collé');break;
    case 'newfile':ui.imp=null;ui.step=1;ui.importErr=null;render();break;
    case 'cancel-import':ui.fromSettings=false;ui.imp=null;go('app','settings');break;
    case 'analyze':
      if(!ui.imp||requiredMissing(ui.imp.map).length){toast('Il manque une colonne.');break;}
      var built=buildClients(ui.imp);
      if(!built.clients.length){ui.importErr={title:'Aucun client valide',msg:'Aucune ligne n’a pu être importée. Vérifie que la colonne du prénom est bien choisie.'};ui.step=1;ui.imp=null;render();break;}
      var res=mergeClients(built);res.file=ui.imp.name;ui.impRes=res;ui.imp=null;ui.fromSettings=false;afterImport();break;
    case 'sample':S.clients=sampleClients();S.messages=[];S.sample=true;save();ui.importErr=null;ui.imp=null;ui.impRes={sample:true,added:S.clients.length,updated:0,rebooked:0,dupes:0,ignored:0};ui.fromSettings=false;afterImport();break;
    case 'to-result':readProfile('f-',['nom','lien','contact']);ui.errors=validateProfile();
      if(Object.keys(ui.errors).length){save();render();var ff=document.getElementById(ui.errors.nom?'f-nom':ui.errors.lien?'f-lien':'f-contact');if(ff)ff.focus();}
      else{save();ui.step=4;try{window.scrollTo(0,0);}catch(e){}render();}break;
    case 'activate':
      var cb=document.getElementById('f-consent');
      if(!cb||!cb.checked){toast('Coche d’abord la confirmation d’accord des clients.');break;}
      S.auto.consent=true;S.auto.on=true;S.onboarded=true;var nn=runEngine();save();kick();ui.filter='recover';ui.shown=40;go('app','clients');
      toast(nn?nn+' relance'+(nn>1?'s':'')+' préparée'+(nn>1?'s':'')+SIM()+'.':'Relances automatiques activées'+SIM()+'.');break;
    case 'skip-activate':case 'see-app':S.onboarded=true;save();ui.filter='recover';ui.shown=40;go('app','clients');break;
    case 'tab':ui.tab=v;ui.shown=40;go('app',v);break;
    case 'filter':ui.filter=v;ui.shown=40;render();break;
    case 'more':ui.shown+=40;render();break;
    case 'open-client':
      var c=clientById(id);if(!c)break;var e=enrich(c),el=eligibility(e,false),pm=pending(c);
      ui.draftMsg=pm?pm.text:(el.ok?renderTpl(S.templates[el.stage-1],c,e.days):'');ui.sheet=id;render();break;
    case 'close':ui.sheet=null;render();break;
    case 'send':doSend(ch,null,ui.sheet);break;
    case 'copy':toast(copyText(ui.draftMsg)?'Message copié.':'Copie impossible : sélectionne le texte.');break;
    case 'replied':var rc=clientById(ui.sheet);if(rc){rc.replied=!rc.replied;save();render();}break;
    case 'recovered':var cc=clientById(ui.sheet);if(cc){recover(cc,true);save();toast('◇  Rendez-vous récupéré.');render();}break;
    case 'unsub':var uc=clientById(ui.sheet);if(uc){unsubscribe(uc,'manual');toast('Client désabonné : plus aucune relance.');render();}break;
    case 'resub':var sc=clientById(ui.sheet);if(sc&&sc.optoutSource==='manual'){sc.optout=false;save();toast('Messages réactivés.');render();}break;
    case 'bulk':var n=bulkRelance();if(n){ui.sheet='queue';render();}else toast('Aucun client éligible.');break;
    case 'open-queue':ui.sheet='queue';render();break;
    case 'send-q':doSend(ch,id,null);break;
    case 'sim-all':var q=S.messages.filter(function(m){return m.status==='a_envoyer';});q.forEach(function(m){markSent(m,'simulation',true);});toast(q.length+' messages simulés. Rien n’est parti réellement.');render();break;
    case 'to-results':ui.sheet=null;go('app','results');break;
    case 'ins':var ta=document.getElementById('tpl'+a.getAttribute('data-i'));if(ta){var s=ta.selectionStart==null?ta.value.length:ta.selectionStart;ta.value=ta.value.slice(0,s)+v+ta.value.slice(ta.selectionEnd==null?s:ta.selectionEnd);ta.focus();var pos=s+v.length;ta.setSelectionRange(pos,pos);var ii=+a.getAttribute('data-i');S.templates[ii]=ta.value;save();updPrev(ii);}break;
    case 'tpl-reset':var ri=+a.getAttribute('data-i');S.templates[ri]=DEFAULT_TPL[ri];save();render();toast('Message par défaut rétabli.');break;
    case 'reimport':ui.fromSettings=true;ui.step=1;ui.errors={};ui.imp=null;ui.importErr=null;go('onboarding');break;
    case 'reset':if(!ui.confirmReset){ui.confirmReset=true;render();setTimeout(function(){ui.confirmReset=false;if(ui.view==='app'&&ui.tab==='settings')render();},4000);}else{S=blank();save();ui.confirmReset=false;ui.filter='recover';go('landing');}break;
  }
});
document.addEventListener('input',function(ev){
  var t=ev.target,b=t.getAttribute&&t.getAttribute('data-bind');if(!b)return;
  if(b==='draft')ui.draftMsg=t.value;
  else if(b.indexOf('tpl')===0){var i=+b.slice(3);S.templates[i]=t.value;saveSoon();updPrev(i);}
  else if(b.indexOf('delay')===0){var n=Math.max(b==='delay1'?0:1,Math.min(60,parseInt(t.value,10)||(b==='delay1'?0:1)));S.delays['r'+b.slice(5)]=n;saveSoon();}
});
document.addEventListener('change',function(ev){
  var t=ev.target,b=t.getAttribute&&t.getAttribute('data-bind');
  if(t.id==='f-file'&&t.files&&t.files[0]){readFile(t.files[0]);return;}
  if(b==='map'&&ui.imp){
    var col=+t.getAttribute('data-col'),val=t.value,map=ui.imp.map;
    Object.keys(map).forEach(function(k){if(map[k]===col)delete map[k];});
    if(val){map[val]=col;ui.imp.src[val]='user';}
    render();return;
  }
  if(b==='consent'){S.auto.consent=t.checked;if(!t.checked)S.auto.on=false;save();render();return;}
  if(b==='set'){
    var old=Object.assign({},S.profile);readProfile('s-',['nom','lien','contact']);
    var pr=document.getElementById('s-prix');if(pr)S.profile.prix=Math.max(0,+pr.value||0);
    var er=validateProfile(),le=document.getElementById('s-lien-err');
    if(er.nom||er.lien||er.contact){S.profile=old;if(le)le.textContent=er.lien||er.nom||er.contact;toast('Vérifie les champs.');return;}
    if(le)le.textContent='';save();toast('Enregistré.');
  }
});
document.addEventListener('toggle',function(ev){if(ev.target&&ev.target.id==='others')ui.othersOpen=ev.target.open;},true);
document.addEventListener('dragover',function(ev){var d=ev.target.closest&&ev.target.closest('.drop');if(d){ev.preventDefault();d.classList.add('over');}});
document.addEventListener('dragleave',function(ev){var d=ev.target.closest&&ev.target.closest('.drop');if(d)d.classList.remove('over');});
document.addEventListener('drop',function(ev){var d=ev.target.closest&&ev.target.closest('.drop');if(d){ev.preventDefault();d.classList.remove('over');var f=ev.dataTransfer&&ev.dataTransfer.files&&ev.dataTransfer.files[0];if(f)readFile(f);}});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&ui.sheet){ui.sheet=null;render();}
  if(ev.key==='Enter'&&ev.target&&(ev.target.id==='a-pass'||ev.target.id==='a-email')){var b=document.querySelector('[data-act=auth-in]');if(b&&!b.disabled)b.click();}});
window.addEventListener('pagehide',save);window.addEventListener('beforeunload',save);

/* moteur : tourne à l'ouverture puis toutes les minutes tant que l'app est ouverte */
function tick(){
  if(BACKEND&&sess){if(sync.state==='error')pushNow();pollServer().then(function(c){if(c&&ui.view==='app'&&!ui.sheet&&!isTyping())render();});}
  if(!S.auto.on)return;
  var n=runEngine();
  if(n&&ui.view==='app'&&!ui.sheet&&!isTyping()){render();toast(n+' relance'+(n>1?'s':'')+' préparée'+(n>1?'s':'')+SIM()+'.');}
}
setInterval(tick,60000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)tick();});

window.RC={parseCSV:parseCSV,startImport:startImport,buildClients:buildClients,mergeClients:mergeClients,requiredMissing:requiredMissing,statusOf:statusOf,renderTpl:renderTpl,parseDate:parseDate,
  state:function(){return S;},counts:counts,stats:stats,ui:ui,enrich:enrich,eligibility:eligibility,runEngine:runEngine,setToday:setToday,avgInterval:avgInterval,save:save,PROVIDERS:PROVIDERS};
if(S.auto.on)runEngine();
render();
if(BACKEND){
  fetchStatus().then(function(){if(ui.view==='app')render();});
  if(sess)bootRemote().then(function(){if(ui.view==='landing'&&S.onboarded)go('app','clients');else render();},
    function(e){sync.state='error';if(e&&(e.status===401||e.status===403||/expir/i.test(e.message||''))){storeSess(null);S=blank();REMOTE=false;}render();});
}
})();
</script>
